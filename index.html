<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snack Showdowns</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fdf6ec;
    color: #3a2e1f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    text-align: center;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 8px;
  }
  p.subtitle {
    color: #7a6a54;
    margin-bottom: 40px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 320px;
  }
  a.card {
    display: block;
    padding: 20px;
    background: #ffffff;
    border: 1px solid #e8ddc9;
    border-radius: 12px;
    text-decoration: none;
    color: #3a2e1f;
    font-size: 1.1rem;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .emoji {
    font-size: 1.5rem;
    display: block;
    margin-bottom: 6px;
  }
</style>
</head>
<body>
  <h1>🍿 Snack Showdowns</h1>
  <p class="subtitle">Pick a category to see who wins</p>
  <div class="links">
    <a class="card" href="Biscuit_Showdown.html">
      <span class="emoji">🍪</span>
      Biscuit Showdown
    </a>
    <a class="card" href="Chips_Showdown.html">
      <span class="emoji">🥔</span>
      Chips Showdown
    </a>
  </div>
</body>
</html>
